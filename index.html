<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Deck — German Flashcards A2 & B1 (telc)</title>
<style>
:root{
  --bg:#0f1117; --panel:#181b24; --panel2:#1f232f; --line:#2a2f3d;
  --txt:#e8eaf0; --muted:#9aa2b4; --accent:#6c8cff; --accent2:#4cd4b0;
  --good:#3ecf8e; --warn:#ffb454; --bad:#ff6b6b; --radius:16px;
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --line:#dfe3ee;
  --txt:#1a1e28; --muted:#5a6272; --accent:#3a5cff; --accent2:#0fb894;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--txt); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word; /* long German compounds can't overflow the viewport */
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}

/* Header */
header{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.hbar{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand .flag{font-size:20px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--panel2);padding:4px;border-radius:12px}
.tabs button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.active{background:var(--panel);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--panel2);font-size:17px;display:grid;place-items:center}
.icon-btn:hover{background:var(--line)}

/* Home stat row */
.hero{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 22px}
.stat{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.stat .n.accent{color:var(--accent)}
.stat .n.good{color:var(--good)}

h2.section{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 12px}

/* Batch grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .cat{font-size:13px;color:var(--muted);font-weight:600}
.card .title{font-size:17px;font-weight:700;margin:2px 0 10px;letter-spacing:-.01em}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}

/* Study view */
.study{max-width:640px;margin:0 auto}
.study-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.study-top .back{font-size:14px;color:var(--muted);font-weight:600}
.study-title{font-weight:700;font-size:16px}
.progress-wrap{margin:6px 0 18px}
.progress-line{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress-line>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}

.flip{perspective:1600px;margin:6px 0}
.flip-inner{
  position:relative;width:100%;min-height:340px;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;cursor:pointer;
}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
}
.face.back{transform:rotateY(180deg)}
.pos-tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
.word-de{font-size:34px;font-weight:800;letter-spacing:-.02em}
.word-plural{color:var(--muted);font-size:16px;margin-top:6px}
.tap-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
.word-en{font-size:24px;font-weight:700;margin-bottom:4px}
.ex{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);width:100%}
.ex-row{display:flex;align-items:flex-start;gap:8px;justify-content:center}
.ex .de{font-size:17px;font-weight:600;font-style:italic}
.ex .en{font-size:15px;color:var(--muted);margin-top:4px}
.known-flag{position:absolute;top:14px;right:16px;font-size:12px;font-weight:700;color:var(--good)}

/* back face: scrollable so meanings + rule + 2 examples always fit */
.face.back{justify-content:flex-start;padding:24px 22px}
.back-scroll{width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.back-scroll::-webkit-scrollbar{width:6px}
.back-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* meanings list */
.meanings{list-style:none;counter-reset:m;padding:0;margin:12px 0 0;width:100%;text-align:left}
.meanings li{counter-increment:m;position:relative;padding:7px 0 7px 26px;border-top:1px dashed var(--line)}
.meanings li:first-child{border-top:none}
.meanings li::before{content:counter(m);position:absolute;left:0;top:7px;width:18px;height:18px;border-radius:50%;background:var(--panel2);color:var(--accent);font-size:11px;font-weight:800;display:grid;place-items:center}
.m-en{font-weight:600;font-size:15px}
.m-de{display:block;color:var(--muted);font-size:13px;margin-top:1px}

/* grammar rule / usage note */
.rule{margin-top:14px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.45}
.rule-i{font-weight:800;color:var(--accent);margin-right:5px}

/* voice / speaker button */
.speak{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:15px;display:inline-grid;place-items:center;transition:transform .1s,background .12s;flex:none}
.speak:hover{background:var(--accent);transform:scale(1.08)}
.speak:active{transform:scale(.94)}
.front-audio{margin-top:16px}
.ex-audio{display:inline-flex}
.ex-audio .speak{width:28px;height:28px;font-size:13px}

.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;transition:filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn.again{background:var(--panel2);color:var(--warn);border:1px solid var(--line)}
.btn.known{background:var(--good);color:#06231a}
.nav{display:flex;gap:10px;margin-top:10px}
.nav .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-size:14px}
.session-tools{display:flex;gap:10px;justify-content:center;margin-top:16px;color:var(--muted);font-size:13px}
.session-tools button{color:var(--muted);padding:6px 10px;border-radius:8px}
.session-tools button:hover{background:var(--panel2);color:var(--txt)}

/* Patterns list */
.pcat{font-size:15px;font-weight:800;margin:24px 0 8px;color:var(--accent)}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.pcard .pf{font-weight:700;font-size:16px}
.pcard .pn{color:var(--muted);font-size:13px;margin:4px 0 8px}
.pcard .pde{font-style:italic;font-weight:600}
.pcard .pen{color:var(--muted);font-size:14px;margin-top:2px}
.pnum{display:inline-block;min-width:26px;color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}

.empty{text-align:center;color:var(--muted);padding:60px 20px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.active{color:var(--txt);border-color:var(--accent)}
.hidden{display:none!important}
.lvl{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.03em;flex:none}
.lvl-a{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.lvl-a1{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.lvl-a2{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.lvl-b1{background:color-mix(in srgb,var(--accent2) 24%,transparent);color:var(--accent2)}
.chip .badge{margin-left:4px}
/* pattern meta badges */
.pcard .pf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf .ff{flex:1;min-width:0}
.prep{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;letter-spacing:.02em;flex:none;
  background:color-mix(in srgb,var(--accent2) 14%,transparent);color:var(--accent2);
  border:1px solid color-mix(in srgb,var(--accent2) 34%,transparent);font-variant-numeric:tabular-nums}
.gbwrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.gbwrap .gbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pcat .pcat-n{font-size:12px;font-weight:700;color:var(--muted);margin-left:8px}
.ex2{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.done-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:40px 24px;text-align:center}
.done-card .big{font-size:44px}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--txt);font-size:14px}
.search::placeholder{color:var(--muted)}

/* Redemittel */
.use{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;flex:none;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line)}

/* Sprachbausteine drill */
.quiz{max-width:640px;margin:0 auto}
.q-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.q-topic{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-sentence{font-size:20px;font-weight:600;line-height:1.6;margin-bottom:18px}
.q-sentence .gap{display:inline-block;min-width:54px;border-bottom:2px dashed var(--accent);text-align:center;color:var(--accent);font-weight:800}
.q-opts{display:flex;flex-direction:column;gap:10px}
.q-opt{text-align:left;padding:13px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:16px;font-weight:600;transition:border-color .12s,background .12s}
.q-opt:hover:not(:disabled){border-color:var(--accent)}
.q-opt:disabled{cursor:default}
.q-opt.correct{background:color-mix(in srgb,var(--good) 20%,transparent);border-color:var(--good);color:var(--good)}
.q-opt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad);color:var(--bad)}
.q-explain{margin-top:16px;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.5}
.q-explain b{color:var(--accent)}
.q-next{margin-top:16px}

/* ---------- batch overview: study sets ---------- */
.ov-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
.ov-head .ov-sub{color:var(--muted);font-size:14px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.setcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.setcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.setcard .sc-n{font-size:13px;color:var(--muted);font-weight:700}
.setcard .sc-t{font-size:15px;font-weight:700;margin:2px 0 9px;letter-spacing:-.01em}
.setcard.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.setcard .sc-check{position:absolute;top:12px;right:13px;color:var(--good);font-size:13px;font-weight:800}
.bigbtns{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 20px}
.bigbtn{flex:1;min-width:150px;display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;transition:border-color .12s,transform .12s}
.bigbtn:hover{border-color:var(--accent);transform:translateY(-2px)}
.bigbtn .bb-ic{font-size:20px;flex:none}
.bigbtn .bb-t{font-weight:700;font-size:15px}
.bigbtn .bb-s{color:var(--muted);font-size:12.5px;margin-top:1px}
.bigbtn.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.bigbtn .bb-badge{margin-left:auto;font-size:12px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);padding:2px 9px;border-radius:99px;flex:none}

/* ---------- related words (word family) on card back ---------- */
.rel{margin-top:14px;width:100%;text-align:left;border-top:1px dashed var(--line);padding-top:12px}
.rel-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.rel-item{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:14px}
.rel-item .rel-de{font-weight:700}
.rel-item .rel-pos{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--accent);flex:none}
.rel-item .rel-en{color:var(--muted);font-size:13px}

/* ---------- SRS box indicator ---------- */
.srs-dot{position:absolute;top:14px;left:16px;display:flex;gap:3px}
.srs-dot i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.srs-dot i.on{background:var(--accent)}
.due-tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}

/* ---------- keyboard hint ---------- */
.kbd-hint{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}
.kbd-hint kbd{font-family:inherit;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--txt)}

/* ---------- pattern card teaching extras ---------- */
.pnote-back{margin-top:12px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.45;color:var(--txt)}
.pnote-back .pnb-i{font-weight:800;color:var(--accent);margin-right:5px}
.pcard .pde2{font-style:italic;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pcard .pen2{color:var(--muted);font-size:14px;margin-top:2px}

/* ========================================================= */
/* RESPONSIVE                                                */
/* ========================================================= */
@media (max-width:720px){
  .wrap{padding:16px 13px 72px}
  .hbar{gap:10px;padding:11px 13px}
  .brand{font-size:17px}
  /* tabs scroll horizontally instead of overflowing */
  .tabs{margin-left:auto;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:7px 11px;font-size:13px;white-space:nowrap}
  .hero{gap:9px}
  .stat{min-width:0;flex:1 1 calc(50% - 5px);padding:13px 14px}
  .stat .n{font-size:22px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .word-de{font-size:28px}
  .word-en{font-size:21px}
  .face{padding:24px 18px}
  .flip-inner{min-height:300px}
}
@media (max-width:460px){
  .hbar{flex-wrap:wrap}
  .brand .txt{display:none}
  .tabs{order:3;width:100%;margin-left:0;justify-content:flex-start}
  .icon-btn{margin-left:auto}
  .hero{gap:8px}
  .stat{flex:1 1 calc(50% - 4px)}
  .grid{grid-template-columns:1fr;gap:9px}
  .setgrid{grid-template-columns:1fr 1fr}
  .actions{gap:8px}
  .btn{padding:14px 10px;font-size:14px}
  .word-de{font-size:25px}
  .face{padding:22px 15px}
  .q-sentence{font-size:18px}
  .q-opt{font-size:15px;padding:12px 13px}
  .kbd-hint{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand"><span class="flag">🇩🇪</span> <span class="txt">Deutsch Deck</span></div>
    <nav class="tabs">
      <button data-tab="vocab" class="active">Vocab</button>
      <button data-tab="patterns">Patterns</button>
      <button data-tab="redemittel">Redemittel</button>
      <button data-tab="bausteine">Bausteine</button>
    </nav>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty"><div class="spinner"></div>Loading deck…</div>
</main>

<script src="data/patterns.js?v=5"></script>
<script src="data/redemittel.js?v=4"></script>
<script src="data/sprachbausteine.js?v=4"></script>
<script src="data/words.js?v=2"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
